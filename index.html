<!doctype html>
<html lang="ar" dir="rtl" class="dark">

    <meta charset="UTF-8" />

    <!-- Tailwind CSS CDN Fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: {

              violet: {

        padding: 0;
        overflow-x: hidden;
      }

  <body class="bg-[#0B0F19] text-slate-100 antialiased selection:bg-[#00F2FE] selection:text-slate-950">
